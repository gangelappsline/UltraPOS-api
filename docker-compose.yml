# UltraPOS API — local/dev stack: nginx + php-fpm + MySQL 8 + Redis + queue worker.
#
#   cp .env.example .env            # once, on the host (see note below)
#   docker compose up -d --build
#   docker compose exec app php artisan l5-swagger:generate
#
# The app container's entrypoint creates .env (when missing), the APP_KEY, the
# Passport RSA keys and — because ULTRAPOS_AUTO_MIGRATE/ULTRAPOS_AUTO_SEED are
# enabled below — runs `migrate --seed` + `ultrapos:passport-clients`. So the
# only manual steps left are the two above.
#
# If you prefer to drive it yourself, set ULTRAPOS_AUTO_MIGRATE= (empty) and run:
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate --seed
#   docker compose exec app php artisan ultrapos:passport-clients
#
# vendor/ is a named volume so the image-installed dependencies survive the
# bind mount of the project directory. After changing composer.json, refresh it:
#   docker compose down -v && docker compose up -d --build
#
# API:        http://localhost:8080/api/v1
# Swagger UI: http://localhost:8080/api/documentation
# OpenAPI:    http://localhost:8080/api/documentation.json
# Health:     http://localhost:8080/api/health

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultrapos_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ultrapos}
      DB_USERNAME: ${DB_USERNAME:-ultrapos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      # Absolute URLs generated by the app (Swagger UI "Try it out" + links).
      APP_URL: http://localhost:${APP_PORT:-8080}
      L5_SWAGGER_CONST_HOST: http://localhost:${APP_PORT:-8080}/api/v1
      # Entrypoint: migrate --seed + Passport OAuth clients (idempotent).
      ULTRAPOS_AUTO_MIGRATE: "true"
      ULTRAPOS_AUTO_SEED: "true"
      ULTRAPOS_AUTO_KEYS: "true"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ultrapos]

  nginx:
    image: nginx:1.27-alpine
    container_name: ultrapos_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [ultrapos]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultrapos_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--timeout=120"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-ultrapos}
      DB_USERNAME: ${DB_USERNAME:-ultrapos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      # Only the php-fpm container migrates/creates keys; workers must not race it.
      ULTRAPOS_AUTO_MIGRATE: "false"
      ULTRAPOS_AUTO_KEYS: "false"
      APP_URL: http://localhost:${APP_PORT:-8080}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks: [ultrapos]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultrapos_scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction --quiet || true; sleep 60; done"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-ultrapos}
      DB_USERNAME: ${DB_USERNAME:-ultrapos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      ULTRAPOS_AUTO_MIGRATE: "false"
      ULTRAPOS_AUTO_KEYS: "false"
      APP_URL: http://localhost:${APP_PORT:-8080}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks: [ultrapos]

  mysql:
    image: mysql:8.0
    container_name: ultrapos_mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ultrapos}
      MYSQL_USER: ${DB_USERNAME:-ultrapos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ultrapos]

  redis:
    image: redis:7-alpine
    container_name: ultrapos_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ultrapos]

volumes:
  mysql_data:
  redis_data:
  # Image-installed composer dependencies, shadowed by the bind mount above.
  vendor:

networks:
  ultrapos:
    driver: bridge

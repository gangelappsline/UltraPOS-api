# UltraPOS API — local/dev stack: nginx + php-fpm + MySQL 8 + Redis + queue worker.
#
#   docker compose up -d --build
#   docker compose exec app php artisan key:generate
#   docker compose exec app php artisan migrate --seed
#   docker compose exec app php artisan passport:install
#   docker compose exec app php artisan l5-swagger:generate
#
# API:        http://localhost:8080/api/v1
# Swagger UI: http://localhost:8080/api/documentation
# Health:     http://localhost:8080/api/health

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultrapos_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ultrapos}
      DB_USERNAME: ${DB_USERNAME:-ultrapos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ultrapos]

  nginx:
    image: nginx:1.27-alpine
    container_name: ultrapos_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [ultrapos]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultrapos_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--timeout=120"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-ultrapos}
      DB_USERNAME: ${DB_USERNAME:-ultrapos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ultrapos]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ultrapos_scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction --quiet; sleep 60; done"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-ultrapos}
      DB_USERNAME: ${DB_USERNAME:-ultrapos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
    networks: [ultrapos]

  mysql:
    image: mysql:8.0
    container_name: ultrapos_mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ultrapos}
      MYSQL_USER: ${DB_USERNAME:-ultrapos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ultrapos]

  redis:
    image: redis:7-alpine
    container_name: ultrapos_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ultrapos]

volumes:
  mysql_data:
  redis_data:
  vendor:

networks:
  ultrapos:
    driver: bridge
